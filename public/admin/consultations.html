<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultations Bookings | Admin Panel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <!-- Sidebar -->
  <aside class="admin-sidebar"></aside>

  <!-- Main Content -->
  <div class="admin-layout">
    <!-- Header -->
    <header class="admin-header">
      <div class="header-title">
        <h1>Consultation Booking Requests</h1>
      </div>
      <div class="header-user">
        <i class="fas fa-user-circle"></i>
        <span id="admin-user-display">Admin</span>
      </div>
    </header>

    <!-- Container -->
    <main class="admin-container">
      <div class="data-card">
        <div class="card-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
          <h2>Appointment Requests</h2>
          <div class="card-actions">
            <div class="view-toggle-group" style="display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: #fff;">
              <button class="btn-toggle active" id="btn-view-table" style="border: none; padding: 8px 16px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: var(--transition);">
                <i class="fas fa-list"></i> List View
              </button>
              <button class="btn-toggle" id="btn-view-calendar" style="border: none; padding: 8px 16px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: var(--transition); border-left: 1px solid var(--border);">
                <i class="fas fa-calendar-alt"></i> Calendar View
              </button>
            </div>
          </div>
        </div>

        <div class="admin-table-container" id="consultations-list-view">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Client</th>
                <th>Contact Info</th>
                <th>Preferred Details</th>
                <th style="width: 150px;">Status</th>
                <th style="width: 80px;">Actions</th>
              </tr>
            </thead>
            <tbody id="consultations-table-body">
              <tr>
                <td colspan="5" class="text-center">Loading booking requests...</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div id="consultations-calendar-view" style="display: none; padding: 20px;">
          <!-- Custom Premium Month Grid Calendar will be rendered here dynamically -->
        </div>
      </div>
    </main>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
